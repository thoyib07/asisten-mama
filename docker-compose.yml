services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: asisten_mama
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "composer install && npm install && (npm run dev &) && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asisten_mama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
